# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Lane Tester: the API (Odoo) and SUDO secrets are published ONLY encrypted (AES-256, PBKDF2) with the UNLOCK passphrase.
      # The plain values never reach the site; each NUC asks for the passphrase once (install.sh).
      - name: Encrypt Lane Tester secrets
        env:
          API: ${{ secrets.API }}
          SUDO: ${{ secrets.SUDO }}
          UNLOCK: ${{ secrets.UNLOCK }}
        run: |
          rm -rf secrets && mkdir -p secrets
          for n in API SUDO UNLOCK; do if [ -n "${!n}" ]; then echo "$n: set"; else echo "::warning::$n secret is missing or empty (Settings > Secrets and variables > Actions > Repository secrets)"; fi; done
          if [ -z "$UNLOCK" ]; then echo "::warning::UNLOCK secret not set - no secrets published"; exit 0; fi
          enc() { printf '%s' "$1" | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -salt -pass env:UNLOCK -out "$2"; }
          if [ -n "$API" ]; then enc "$API" secrets/api.enc; fi
          if [ -n "$SUDO" ]; then enc "$SUDO" secrets/sudo.enc; fi
          printf '%s' "check" | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -salt -pass env:UNLOCK -out secrets/check.enc
          ls -l secrets
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
